<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Sfondo Sfumato -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#0f1d31"/>
    </linearGradient>
    
    <!-- Sfumatura Brand Palermo Fix -->
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff8e53"/>
    </linearGradient>

    <!-- Ombra Morbida -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; font-size: 68px; fill: #ffffff; }
    .subtitle { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 600; font-size: 30px; fill: #a8dadc; }
    .badge-text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .tagline { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 500; font-size: 24px; fill: #f1faee; opacity: 0.8; }
  </style>

  <!-- Sfondo Principale -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Cerchi Decorativi di Sfondo (Effetto Mappa/Radar) -->
  <circle cx="950" cy="315" r="320" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2"/>
  <circle cx="950" cy="315" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="950" cy="315" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Card Centrale / Glassmorphism -->
  <rect x="80" y="80" width="1040" height="470" rx="36" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" filter="url(#drop-shadow)"/>

  <!-- Logo PF Sfumato -->
  <circle cx="170" cy="180" r="45" fill="url(#primary-gradient)"/>
  <text x="170" y="195" class="badge-text" text-anchor="middle">PF</text>

  <!-- Testi Principali -->
  <text x="240" y="192" class="title">Palermo Fix 🚀</text>
  <text x="80" y="320" class="subtitle">Mappa Civica di Segnalazione Rifiuti</text>
  
  <text x="80" y="390" class="tagline">Segnala, monitora e contribuisci a mantenere pulita la città.</text>
  <text x="80" y="425" class="tagline">Piattaforma partecipativa in tempo reale per i cittadini di Palermo.</text>

  <!-- Marker Mappa Grafico sulla Destra -->
  <g transform="translate(950, 270)" filter="url(#drop-shadow)">
    <!-- Pin Sfumato -->
    <path d="M0 -80 C-44 -80 -80 -44 -80 0 C-80 52.5 0 120 0 120 C0 120 80 52.5 80 0 C80 -44 44 -80 0 -80 Z" fill="url(#primary-gradient)"/>
    <!-- Icona Cestino / Rifiuti dentro il Pin -->
    <text x="0" y="15" font-size="50" text-anchor="middle">🚮</text>
  </g>

  <!-- Footer Tag -->
  <rect x="80" y="480" width="210" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
  <text x="185" y="505" font-family="'Plus Jakarta Sans', Arial" font-size="16" font-weight="700" fill="#ff8e53" text-anchor="middle">📍 PALERMO</text>
</svg>
