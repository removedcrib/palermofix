<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Palermo Fix - Segnalazioni Rifiuti</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root { 
            --primary: #ff6b35; 
            --primary-gradient: linear-gradient(135deg, #ff6b35 0%, #ff8e53 100%);
            --secondary: #00b4d8;
            --success: #2ec4b6;
            --dark: #1d3557; 
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; background-color: #f0f4f8; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* Stile Modal Benvenuto */
        #welcome-modal {
            position: fixed; top:0; left:0; width:100%; height:100%; z-index: 9999;
            background: rgba(29, 53, 87, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .welcome-content {
            background: white; padding: 40px; border-radius: 30px; max-width: 400px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .welcome-content h1 { color: var(--primary); margin-top: 0; }
        
        #ui-overlay { 
            position: absolute; bottom: 35px; left: 0; right: 0; z-index: 1000; 
            padding: 0 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; 
            pointer-events: none;
        }

        .btn-main { 
            background: var(--primary-gradient); color: white; border: none; 
            padding: 16px 28px; border-radius: 20px; font-size: 16px; font-weight: 700; 
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.4); width: 100%; max-width: 380px; 
            cursor: pointer; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 8px; 
            letter-spacing: -0.3px;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 107, 53, 0.5); }
        
        .btn-alt { background: linear-gradient(135deg, #2ec4b6 0%, #20b2aa 100%); }

        .slide-panel { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); 
            width: 90%; max-width: 440px; max-height: 85vh; background: var(--glass-bg); 
            backdrop-filter: blur(16px); border-radius: 28px; z-index: 2000; opacity: 0; 
            pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
            padding: 24px; overflow-y: auto; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }
        .slide-panel.active { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: rgba(0,0,0,0.05); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }

        .form-group { margin-bottom: 16px; }
        input, textarea, select { width: 100%; padding: 14px 16px; border: 2px solid rgba(0,0,0,0.06); border-radius: 14px; background: rgba(255, 255, 255, 0.9); }
        
        #photo-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; justify-content: center; align-items: center; }
        #code-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9998; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 30px 24px; border-radius: 28px; max-width: 360px; text-align: center; }
        .code-box { background: #fff3ed; border: 2px dashed var(--primary); padding: 14px; font-size: 24px; font-weight: 800; color: var(--primary); margin: 20px 0; border-radius: 14px; }

        #toast { position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--dark); color: white; padding: 12px 24px; border-radius: 50px; z-index: 3000; opacity: 0; transition: all 0.3s; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- Modal Benvenuto -->
    <div id="welcome-modal">
        <div class="welcome-content">
            <h1>Palermo Fix 🚮</h1>
            <p>Benvenuto! Aiutaci a ripulire Palermo. Segnala i cumuli di rifiuti e monitora la situazione in tempo reale.</p>
            <button class="btn-main" onclick="closeWelcomeModal()">Inizia ora</button>
        </div>
    </div>

    <div id="map"></div>
    <div id="toast"></div>

    <div id="photo-overlay" onclick="closeZoom()"><img id="zoomed-img" src=""></div>

    <div id="code-modal">
        <div class="modal-content">
            <h3>Segnalazione Inviata! 🚀</h3>
            <p>Conserva questo codice per chiudere la segnalazione una volta che il problema sarà risolto:</p>
            <div class="code-box" id="display-closure-code">------</div>
            <button class="btn-main" style="width: 100%;" onclick="closeCodeModal()">Ho salvato il codice</button>
        </div>
    </div>

    <div id="ui-overlay">
        <button class="btn-main" onclick="openPanel('report-panel')">✨ Nuova Segnalazione Rifiuti</button>
        <button class="btn-main btn-alt" onclick="openPanel('close-panel')">✔️ Risolvi con Codice</button>
    </div>

    <!-- Pannelli omessi per brevità, sono identici ai tuoi -->
    <div id="report-panel" class="slide-panel">...</div>
    <div id="close-panel" class="slide-panel">...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Configurazione Firebase ... (la tua esistente)
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Controllo al caricamento della pagina
        window.onload = function() {
            if (localStorage.getItem('palermoFix_intro_visto') === 'true') {
                document.getElementById('welcome-modal').style.display = 'none';
            }
        };

        function closeWelcomeModal() {
            document.getElementById('welcome-modal').style.display = 'none';
            localStorage.setItem('palermoFix_intro_visto', 'true');
        }

        // ... (tutto il resto del tuo codice JS rimane invariato)
    </script>
</body>
</html>
