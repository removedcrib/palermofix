<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Palermo Fix - Segnalazioni Rifiuti</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root { 
            --primary: #ff6b35; 
            --primary-gradient: linear-gradient(135deg, #ff6b35 0%, #ff8e53 100%);
            --secondary: #00b4d8;
            --success: #2ec4b6;
            --dark: #1d3557; 
            --glass-bg: rgba(255, 255, 255, 0.88);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; background-color: #f0f4f8; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* Top Bar Elegante */
        #top-bar {
            position: absolute; top: 20px; left: 20px; right: 20px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none;
        }
        .brand-pill {
            background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border); padding: 10px 18px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            pointer-events: auto;
        }
        .brand-logo { 
            width: 32px; height: 32px; background: var(--primary-gradient); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 15px;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.3);
        }
        .brand-info h1 { font-size: 15px; font-weight: 800; color: var(--dark); margin: 0; letter-spacing: -0.3px; line-height: 1.1; }
        .brand-info span { font-size: 11px; color: #666; font-weight: 600; }

        .top-actions { display: flex; gap: 8px; pointer-events: auto; }
        .top-btn {
            background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border); width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--dark);
            font-size: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); transition: all 0.2s;
        }
        .top-btn:hover { background: white; transform: translateY(-2px); }

        #welcome-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; 
            background: rgba(29, 53, 87, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: none; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .welcome-card { 
            background: white; width: 100%; max-width: 400px; padding: 35px 25px; 
            border-radius: 30px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); 
        }
        .welcome-card h2 { color: var(--dark); font-size: 22px; font-weight: 800; margin-top: 0; margin-bottom: 12px; }
        .welcome-card p { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .step { display: none; }
        .step.active { display: block; }
        .step-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; transition: all 0.3s; }
        .step-dot.active { background: var(--primary); width: 24px; border-radius: 4px; }
        .welcome-actions { display: flex; flex-direction: column; gap: 10px; }

        #ui-overlay { 
            position: absolute; bottom: 35px; left: 0; right: 0; z-index: 1000; 
            padding: 0 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; 
            pointer-events: none;
        }

        .btn-main { 
            background: var(--primary-gradient); color: white; border: none; 
            padding: 16px 28px; border-radius: 20px; font-size: 16px; font-weight: 700; 
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.4); width: 100%; max-width: 380px; 
            cursor: pointer; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 8px; 
            letter-spacing: -0.3px;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 107, 53, 0.5); }
        .btn-alt { background: linear-gradient(135deg, #2ec4b6 0%, #20b2aa 100%); }

        .slide-panel { 
            position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(0.9); 
            width: 90%; max-width: 440px; max-height: 85vh; 
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 28px; 
            z-index: 2000; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
            padding: 24px; box-sizing: border-box; overflow-y: auto; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }
        .slide-panel.active { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { 
            background: rgba(0,0,0,0.05); border: none; width: 36px; height: 36px; border-radius: 50%;
            font-size: 18px; cursor: pointer; color: var(--dark);
        }

        .legend-item { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 13px; font-weight: 600; color: var(--dark); }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }

        .form-group { margin-bottom: 16px; position: relative; }
        input, textarea, select { 
            width: 100%; padding: 14px 16px; border: 2px solid rgba(0,0,0,0.06); 
            border-radius: 14px; box-sizing: border-box; font-size: 14px; background: rgba(255, 255, 255, 0.9);
        }
        
        .privacy-note { font-size: 11px; color: #e76f51; margin-top: 6px; }
        #toast { position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--dark); color: white; padding: 12px 24px; border-radius: 50px; z-index: 3000; opacity: 0; pointer-events: none; transition: all 0.3s; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="brand-pill">
            <div class="brand-logo">PF</div>
            <div class="brand-info">
                <h1>Palermo Fix</h1>
                <span id="active-count-badge">Caricamento...</span>
            </div>
        </div>
        <div class="top-actions">
            <button class="top-btn" onclick="openPanel('legend-panel')">🗺️</button>
            <button class="top-btn" onclick="openWelcomeModal()">ℹ️</button>
        </div>
    </div>

    <!-- ... (ALTRI MODAL E OVERLAY OMESSI PER BREVITA') ... -->

    <!-- Pannello Informativa Privacy (GDPR) con Firma Personalizzata -->
    <div id="privacy-modal" class="slide-panel">
        <div class="panel-header">
            <h2>Informativa Privacy</h2>
            <button class="close-btn" onclick="closePanel('privacy-modal')">&times;</button>
        </div>
        <div style="font-size: 13px; color: #444; line-height: 1.6; max-height: 50vh; overflow-y: auto; padding-right: 5px; text-align: left;">
            <p><b>1. Titolare del Trattamento</b><br>Palermo Fix è una piattaforma civica sperimentale.</p>
            <p><b>2. Dati e Finalità</b><br>Raccogliamo coordinate e foto per mappare il decoro urbano.</p>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            
            <!-- FIRMA PERSONALIZZATA -->
            <div style="text-align: center; padding: 10px 0;">
                <p style="font-size: 11px; color: #888; font-style: italic; margin-bottom: 5px;">Progetto sviluppato da</p>
                <h3 style="font-size: 20px; font-weight: 800; letter-spacing: 3px; margin: 0; line-height: 1;">
                    <span style="color: #000000;">A.N.</span><span style="color: #FF66CC;">O.N.</span>
                </h3>
                <p style="font-size: 10px; color: #aaa; margin: 5px 0 10px 0;">© 2026</p>
                <a href="mailto:hi@palermofix.it" style="display: inline-block; color: var(--primary); font-size: 12px; font-weight: 700; text-decoration: none; border: 1.5px solid var(--primary); padding: 4px 12px; border-radius: 20px;">
                    ✉️ hi@palermofix.it
                </a>
            </div>
        </div>
        <button class="btn-main" onclick="closePanel('privacy-modal')" style="width: 100%; max-width: none; margin-top: 15px;">Ho capito</button>
    </div>

    <!-- ... (RESTO DEL CODICE SCRIPT) ... -->
    <script>
        // ... (LOGICA FUNZIONANTE) ...
        async function submitReport() {
            // ... [LOGICA GIA' PRESENTE]
            // Ho aggiunto la chiusura corretta del file reader/promessa
            const imageInput = document.getElementById('image-input');
            let imageDataUrl = "";
            if (imageInput.files && imageInput.files[0]) {
                const file = imageInput.files[0];
                imageDataUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }
            // ... continua con l'invio a Firestore
        }
    </script>
</body>
</html>
