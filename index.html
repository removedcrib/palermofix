<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Palermo Fix - Segnalazioni</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        #ui-overlay { position: absolute; bottom: 20px; left: 0; right: 0; z-index: 1000; padding: 0 20px; text-align: center; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 18px 30px; border-radius: 50px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 400px; cursor: pointer; }
        
        #report-panel { position: fixed; bottom: -100%; left: 0; right: 0; height: 85vh; background: white; border-radius: 20px 20px 0 0; z-index: 2000; transition: bottom 0.3s ease-out; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #report-panel.active { bottom: 0; }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-secondary { background: #f39c12; color: white; border: none; padding: 10px; border-radius: 8px; margin: 5px 0; cursor: pointer; width: 100%; }

        /* Stile moderno per popup mappa */
        .custom-popup img { width: 100%; border-radius: 8px; margin-top: 10px; }
        
        /* Toast Notification */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 30px; z-index: 3000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="toast"></div>

    <div id="ui-overlay">
        <button class="btn-main" onclick="openPanel()">+ Nuova Segnalazione</button>
    </div>

    <div id="report-panel">
        <div class="panel-header">
            <h2>Nuova Segnalazione</h2>
            <button onclick="closePanel()" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
        </div>
        <div class="form-group">
            <input type="text" id="address-input" placeholder="Indirizzo...">
            <button class="btn-secondary" onclick="searchAddress()">Cerca sulla mappa</button>
            <button class="btn-secondary" onclick="useGPS()">Usa GPS</button>
        </div>
        <div class="form-group">
            <input type="file" id="image-input" accept="image/*" capture="environment">
        </div>
        <div class="form-group">
            <textarea id="desc-input" placeholder="Descrizione..." rows="3"></textarea>
        </div>
        <button class="btn-main" onclick="submitReport()">Invia Segnalazione</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { /* ... il tuo config ... */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        var map = L.map('map').setView([38.1157, 13.3615], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        // Funzione Toast moderna
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 3000);
        }

        function loadApprovedMarkers() {
            db.collection("segnalazioni").where("stato", "==", "approvata").get().then((snapshot) => {
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    if (d.lat && d.lng) {
                        const content = `
                            <div class="custom-popup">
                                <b>Segnalazione</b>
                                <p>${d.descrizione || 'Nessuna descrizione'}</p>
                                ${d.foto ? `<img src="${d.foto}">` : ''}
                            </div>`;
                        L.marker([d.lat, d.lng]).addTo(map).bindPopup(content);
                    }
                });
            });
        }

        loadApprovedMarkers();
        
        // ... (restano invariate le funzioni openPanel, closePanel, setMarker, useGPS, searchAddress) ...

        async function submitReport() {
            if (!selectedCoords) { showToast("Seleziona una posizione prima!"); return; }
            
            // ... (logica invio invariata) ...
            
            try {
                await db.collection("segnalazioni").add({ /* ... dati ... */ });
                showToast("Segnalazione inviata con successo!");
                closePanel();
            } catch (error) {
                showToast("Errore durante l'invio.");
            }
        }
    </script>
</body>
</html>
