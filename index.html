<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Palermo Fix - Segnalazioni Diffuse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        #ui-overlay { position: absolute; bottom: 20px; left: 0; right: 0; z-index: 1000; padding: 0 20px; text-align: center; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 18px 30px; border-radius: 50px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 400px; cursor: pointer; }
        
        #report-panel { position: fixed; bottom: -100%; left: 0; right: 0; height: 85vh; background: white; border-radius: 20px 20px 0 0; z-index: 2000; transition: bottom 0.3s ease-out; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #report-panel.active { bottom: 0; }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-secondary { background: #f39c12; color: white; border: none; padding: 10px; border-radius: 8px; margin: 5px 0; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ui-overlay">
        <button class="btn-main" onclick="openPanel()">+ Nuova Segnalazione</button>
    </div>

    <div id="report-panel">
        <div class="panel-header">
            <h2>Nuova Segnalazione</h2>
            <button onclick="closePanel()" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
        </div>
        
        <div class="form-group">
            <input type="text" id="address-input" placeholder="Indirizzo o luogo...">
            <button class="btn-secondary" onclick="searchAddress()">Cerca sulla mappa</button>
            <button class="btn-secondary" onclick="useGPS()">Usa la mia posizione GPS</button>
        </div>
        
        <div class="form-group">
            <input type="file" id="image-input" accept="image/*" capture="environment">
        </div>
        <div class="form-group">
            <textarea id="desc-input" placeholder="Descrizione..." rows="3"></textarea>
        </div>
        <button class="btn-main" onclick="submitReport()">Invia Segnalazione</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Firebase SDKs (Modulo compatibile con script classici) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Configurazione Firebase con le tue chiavi
        const firebaseConfig = {
            apiKey: "AIzaSyBK-a10-vtAoJRsKULptXnauRVK8NTnV3E",
            authDomain: "palermofix-9cae9.firebaseapp.com",
            projectId: "palermofix-9cae9",
            storageBucket: "palermofix-9cae9.firebasestorage.app",
            messagingSenderId: "308048759174",
            appId: "1:308048759174:web:86d9f1773885a288b3c407"
        };

        // Inizializzazione Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        var map = L.map('map').setView([38.1157, 13.3615], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        let marker;
        let selectedCoords = null; // Memorizza le coordinate corrette del pin

        // Funzione per caricare e mostrare sulla mappa solo le segnalazioni approvate
        function loadApprovedMarkers() {
            db.collection("segnalazioni").where("stato", "==", "approvata").get().then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.lat && data.lng) {
                        L.marker([data.lat, data.lng]).addTo(map)
                          .bindPopup(`<b>Segnalazione</b><br>${data.descrizione || 'Nessuna descrizione'}`);
                    }
                });
            }).catch((error) => {
                console.error("Errore nel caricamento delle segnalazioni: ", error);
            });
        }

        // Carica i marker all'avvio della pagina
        loadApprovedMarkers();

        function openPanel() { document.getElementById('report-panel').classList.add('active'); }
        function closePanel() { document.getElementById('report-panel').classList.remove('active'); }

        function setMarker(lat, lng) {
            map.setView([lat, lng], 16);
            if (marker) map.removeLayer(marker);
            
            marker = L.marker([lat, lng], {draggable: true}).addTo(map);
            marker.bindPopup("Posizione segnalazione (puoi trascinarla)").openPopup();
            
            selectedCoords = { lat: lat, lng: lng };

            // Aggiorna le coordinate se l'utente trascina il pin sulla mappa
            marker.on('dragend', function(event) {
                var position = marker.getLatLng();
                selectedCoords = { lat: position.lat, lng: position.lng };
            });
        }

        function useGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => setMarker(pos.coords.latitude, pos.coords.longitude),
                    err => alert("Impossibile recuperare la posizione GPS.")
                );
            } else { alert("GPS non supportato dal browser."); }
        }

        function searchAddress() {
            const query = document.getElementById('address-input').value;
            if(!query) { alert("Inserisci un indirizzo valido."); return; }
            
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}, Palermo`)
                .then(r => r.json())
                .then(d => {
                    if (d.length > 0) {
                        setMarker(parseFloat(d[0].lat), parseFloat(d[0].lon));
                    } else {
                        alert("Indirizzo non trovato.");
                    }
                })
                .catch(e => alert("Errore durante la ricerca dell'indirizzo."));
        }

        async function submitReport() {
            if (!selectedCoords) {
                alert("Seleziona prima una posizione sulla mappa (tramite GPS o Indirizzo).");
                return;
            }

            const description = document.getElementById('desc-input').value;
            const imageInput = document.getElementById('image-input');
            
            let imageDataUrl = "";

            // Se l'utente ha caricato una foto, la convertiamo in Base64 per poterla salvare e visualizzare nell'admin
            if (imageInput.files && imageInput.files[0]) {
                const file = imageInput.files[0];
                imageDataUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }
            
            try {
                // Salvataggio nel database Firestore nella collezione "segnalazioni" con la foto inclusa
                await db.collection("segnalazioni").add({
                    lat: selectedCoords.lat,
                    lng: selectedCoords.lng,
                    descrizione: description,
                    foto: imageDataUrl,
                    stato: "aperta", // Stato iniziale (richiede approvazione da admin.html)
                    dataCreazione: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Segnalazione inviata con successo! Sarà visibile sulla mappa dopo l\'approvazione.');
                document.getElementById('desc-input').value = '';
                document.getElementById('address-input').value = '';
                document.getElementById('image-input').value = '';
                if (marker) map.removeLayer(marker);
                selectedCoords = null;
                closePanel();
                
            } catch (error) {
                console.error("Errore durante il salvataggio: ", error);
                alert("Errore durante l'invio della segnalazione.");
            }
        }
    </script>
</body>
</html>
